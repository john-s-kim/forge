[project]
name = "forge"
version = "0.1.0"
description = "A miniature GPU training platform: scheduler, run tracking, dashboard, failure triage"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "flask>=3.0",
    "prometheus-client>=0.20",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=22", "nats-py>=2.7", "psycopg[binary]>=3.2", "redis>=5.0"]
kube = ["kubernetes>=30"]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-requests"]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length

[tool.mypy]
python_version = "3.12"
files = ["src/forge"]
ignore_missing_imports = true
check_untyped_defs = true
