{{- range .Values.teams }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: forge-{{ . }}
  labels:
    forge.dev/team: {{ . | quote }}
    pod-security.kubernetes.io/enforce: restricted
---
# Training pods may reach DNS and the Forge API, and nothing else; nothing may reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: training-pods
  namespace: forge-{{ . }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Release.Namespace }} }
          podSelector:
            matchLabels: { app: {{ $.Release.Name }}-api }
      ports:
        - { protocol: TCP, port: {{ $.Values.api.port }} }
{{- end }}
