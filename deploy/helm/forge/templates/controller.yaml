apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller
spec:
  replicas: 1 # exactly one scheduler; it holds no leader lock
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-controller }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-controller }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: {{ .Release.Name }}-controller
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["forge", "controller"]
          ports: [{ containerPort: 9100 }]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }} }
            - secretRef: { name: {{ default .Release.Name .Values.existingSecret }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
