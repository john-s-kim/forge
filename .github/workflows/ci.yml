name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"  # setup-uv has already created and activated .venv
      - run: uv run ruff format --check src tests examples
      - run: uv run ruff check src tests examples
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Scheduler benchmark (smoke)
        run: uv run python -m forge.scheduler.bench --nodes 16 --jobs 800
      - name: Triage baseline
        run: uv run python -m forge.triage.eval

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forge:ci .
      - name: Stack smoke test
        run: |
          docker compose up -d --wait
          KEY=$(docker compose exec -T api forge admin bootstrap)
          JOB=$(docker compose exec -T -e FORGE_API_KEY=$KEY api forge submit --gpus 2 -- python examples/train.py --steps 50 --sleep 0)
          for i in $(seq 1 30); do
            STATE=$(docker compose exec -T -e FORGE_API_KEY=$KEY api forge status $JOB | head -1 | awk '{print $NF}')
            [ "$STATE" = "SUCCEEDED" ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/forge
      - run: helm template forge deploy/helm/forge --set 'teams={vision,planning}' --set secret=ci > /dev/null
